<title>Culture Shift</title>
<meta name="description" content="A 12 to 15 minute game: run a company's security awareness and culture program for a year, and find out what actually changes behavior.">

<style>
/* Same visual system as The 2AM Page, Keys to the Agent and Ship It? */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --ink:#1c1a19; --muted:#6a6460; --line:#dcd6d0;
  --red:#cc0000; --red-soft:#fbe6e6; --aqua:#00796b; --aqua-soft:#e2f2ef; --amber:#a35a00; --amber-soft:#fbefdc;
  --good:#2e7d4f; --good-soft:#e3f2e8; --shadow:0 1px 0 rgba(0,0,0,.04);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.credit{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.credit a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
a{color:var(--aqua)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--red);padding-bottom:10px;margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:28px;letter-spacing:.01em}
.brand .eyebrow{color:var(--red)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--muted)}
.linkbtn:hover{border-color:var(--ink);color:var(--ink)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.intro .lede{font-size:19px;max-width:60ch}
.intro h2{font-size:44px;margin:6px 0 14px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.rules ul{margin:8px 0 0;padding-left:18px}
.rules li{margin:6px 0}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.case:hover{border-color:var(--ink)}
.case h3{font-size:21px}
.case p{margin:0;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:13px 22px;font-weight:600;font-size:16px}
.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
.note{font-size:13px;color:var(--muted)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.scene-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--red)}
.step{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scene-body{padding:20px 22px 24px}
.scene-body h2{font-size:30px;margin-bottom:10px}
.scene-body p{margin:0 0 12px;max-width:68ch}
.inject{border-left:4px solid var(--ink);background:var(--bg);padding:10px 14px;border-radius:0 8px 8px 0;margin:4px 0 16px;font-size:15px}
.inject .eyebrow{display:block;margin-bottom:2px}
.outcome{border-radius:10px;padding:14px 16px;margin:4px 0 16px;border:1px solid var(--line)}
.outcome.l0{background:var(--good-soft);border-color:var(--good)}
.outcome.l1{background:var(--amber-soft);border-color:var(--amber)}
.outcome.l2{background:var(--red-soft);border-color:var(--red)}
.outcome .verdict{display:block;margin-bottom:4px}
.l0 .verdict{color:var(--good)} .l1 .verdict{color:var(--amber)} .l2 .verdict{color:var(--red)}
.outcome p{margin:0}
.ask{font-weight:600;margin-top:4px!important}
.choices{display:grid;gap:10px;margin-top:8px}
.choice{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--ink)}
.choice .k{font-family:var(--f-mono);font-weight:600;border:1px solid var(--line);border-radius:6px;text-align:center;padding:2px 0;color:var(--muted)}
.choice[disabled]{cursor:default;opacity:.55}
.choice.picked{opacity:1;border-color:var(--ink)}
.result{margin-top:18px;border-radius:10px;padding:16px 18px;border:1px solid var(--line);background:var(--bg)}
.result.best{background:var(--good-soft);border-color:var(--good)}
.result.ok{background:var(--amber-soft);border-color:var(--amber)}
.result.poor{background:var(--red-soft);border-color:var(--red)}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.best .verdict{color:var(--good)} .ok .verdict{color:var(--amber)} .poor .verdict{color:var(--red)}
.result p{margin:6px 0 0}
.lesson{font-size:14px;color:var(--muted);margin-top:8px!important}
.result .primary{margin-top:14px}
.rail{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.board h3{font-size:18px;margin-bottom:10px}
.co{font-weight:600}
.co-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.meter{margin:10px 0}
.meter .lab{display:flex;justify-content:space-between;font-size:13px}
.meter .lab b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.meter .hint{font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.legs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.leg{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.leg.on{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.leg.half{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:320px;overflow:auto}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.log .empty{display:block;color:var(--muted);font-style:italic}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.progress{display:flex;gap:4px;padding:10px 20px 14px;border-top:1px solid var(--line)}
.progress span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--ink)}
.progress span.now{background:var(--red)}
.progress span.live{outline:1px dashed var(--muted);outline-offset:1px}
.end h2{font-size:40px;margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .n{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.trifecta{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.trifecta svg{width:100%;height:auto}
.trifecta svg text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.debrief{display:grid;gap:10px;margin-top:10px}
.dl{background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:12px 14px}
.dl.best{border-left-color:var(--good)} .dl.ok{border-left-color:var(--amber)} .dl.poor{border-left-color:var(--red)}
.dl .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.dl p{margin:6px 0 0;font-size:15px}
.real{background:var(--aqua-soft);border:1px solid var(--aqua);border-radius:10px;padding:16px 18px;margin-top:22px}
.real h3{font-size:22px;color:var(--aqua);margin-bottom:6px}
.real ul{margin:6px 0 0;padding-left:18px}
.real li{margin:6px 0}
.sec{margin-top:28px}
.sec>h3{font-size:24px;margin-bottom:8px}
@media (max-width:860px){.game,.intro,.trifecta{grid-template-columns:minmax(0,1fr)}.rail{position:static}.cases,.grid2{grid-template-columns:minmax(0,1fr)}.intro h2{font-size:34px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media print{
  :root,:root[data-theme="dark"]{--bg:#ffffff;--panel:#ffffff;--ink:#1c1a19;--muted:#555;--line:#cfcfcf;color-scheme:light}
  body{background:#fff;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .topbar{margin-bottom:12px}
  #homeBtn,.end .row,.rail .log{display:none!important}
  .game{display:block}
  .rail{display:none!important}
  .grid2{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .trifecta{grid-template-columns:200px minmax(0,1fr)!important}
  .dl,.stat,.real,.outcome,.trifecta{break-inside:avoid;page-break-inside:avoid}
  .printonly{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none!important}
  @page{margin:14mm}
}
.printonly{display:none}

/* Culture Shift additions */
.watch{margin-top:14px;padding:10px 12px;border:1px dashed var(--red);border-radius:8px}
.watch .lab{display:flex;justify-content:space-between;font-size:13px;margin-top:4px}
.watch b{font-family:var(--f-mono);font-weight:600;color:var(--red)}
.budgetbox{margin-top:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.budgetbox b{font-family:var(--f-mono);font-weight:600}
.costtag{display:inline-block;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-left:6px;color:var(--muted);white-space:nowrap}
.choice[disabled]:not(.picked){opacity:.4}
</style>

  var s = String(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'');

/* ---------- engine ---------- */
var app = document.getElementById('app'), homeBtn = document.getElementById('homeBtn');
var co, st, meters, picks, cur, spent, liveLvl = null, armed = false;
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function clamp(n){ return Math.max(0, Math.min(100, n)); }
function shuffle(a){ for(var q=a.length-1;q>0;q--){ var w=Math.floor(Math.random()*(q+1)), t=a[q]; a[q]=a[w]; a[w]=t; } return a; }
function shortOf(t){ var s = t.split(/[.:;,]/)[0]; return s.length>60 ? s.slice(0,58)+'…' : s; }
function choicesOf(step){ return typeof step.choices==='function' ? step.choices(st, co) : step.choices; }
function nextStep(from){ for(var k=from;k<S.length;k++){ var s = S[k]; if(!s.when || s.when(st, co)) return k; } return -1; }
function left(q){ return BUDGET[q] - (spent[q]||0); }
function clickRate(){ return st.sim && st.lure ? LURE[st.lure].rate : null; }

function intro(){
  homeBtn.hidden = true;
  var h = '<section class="intro"><div><span class="eyebrow">About 12 to 15 minutes</span><h2>You own the human side of security now.</h2><p class="lede">You\'ve just been put in charge of security awareness and culture at your company. You have a year and a limited budget. Leadership wants a training completion number. Attackers don\'t care about that number.</p><div class="row"><button class="primary" id="go">Start a random scenario</button><span class="note">Each play picks one of three companies.</span></div></div>'+
  '<aside class="rules"><h3>How it works</h3><ul><li>Four quarters. Each one has a few decisions, and the first two come with a small budget.</li><li>Your choices move three meters: <b>reporting</b> (how many people report suspicious things, and how fast), <b>exposure</b> (how likely a human-driven incident is to succeed) and <b>trust</b> (staff goodwill toward the security team).</li><li>Leadership watches a fourth number, the <b>click rate</b>, if you run simulated phishing tests.</li><li>Halfway through, someone outside the company makes a demand. In the last quarter, something real happens.</li></ul><p class="note" style="margin:10px 0 0">Everything stays in your browser. Nothing you choose or type is stored or sent anywhere.</p></aside></section>'+
  '<section class="sec"><h3>Or pick a company</h3><div class="cases">';
  C.forEach(function(c,i){ h += '<button class="case" data-i="'+i+'"><span class="tag">'+esc(c.tag)+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.sector)+'</p><p>'+esc(c.blurb)+'</p></button>'; });
  h += '</div><p class="note" style="margin-top:14px">The companies are invented, and are the same three as in <i>The 2AM Page</i>, <i>Keys to the Agent</i> and <i>Ship It?</i>. The research and cases in the debrief are real.</p></section>';
  var ck = ReportKit.checker(CODE, replay); h += ck.html;
  app.innerHTML = h; ck.wire();
  document.getElementById('go').onclick = function(){ start(Math.floor(Math.random()*C.length)); };
  [].forEach.call(app.querySelectorAll('.case'), function(b){ b.onclick = function(){ start(+b.getAttribute('data-i')); }; });
  window.scrollTo(0,0);
}
function begin(i){
  co = C[i]; st = {}; picks = []; spent = {}; liveLvl = null;
  meters = {rep:20, exp:60, tru:50};
  cur = nextStep(0); homeBtn.hidden = false;
}
function start(i){ begin(i); scene(); }

function meterHTML(k){
  var v = meters[k], hi = (k!=='exp'), good = hi ? v>=60 : v<=40, bad = hi ? v<40 : v>65;
  var col = good ? 'var(--good)' : bad ? 'var(--red)' : 'var(--amber)';
  return '<div class="meter"><div class="lab"><span>'+M[k]+' <span class="hint">('+HINT[k]+')</span></span><b>'+v+'</b></div><div class="bar" role="progressbar" aria-label="'+M[k]+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+v+'"><i style="width:'+v+'%;background:'+col+'"></i></div></div>';
}
function rail(){
  var q = cur>=0 ? S[cur].q : 4, cr = clickRate();
  var h = '<aside class="rail"><div class="board"><div class="eyebrow">Your program</div><div class="co" style="margin-top:6px">'+esc(co.name)+'</div><div class="co-sub">'+esc(co.sector)+'</div>'+meterHTML('rep')+meterHTML('exp')+meterHTML('tru');
  h += '<div class="watch"><span class="eyebrow">Leadership watches</span><div class="lab"><span>Click rate on simulated tests</span><b>'+(cr===null?'none run':cr+'%')+'</b></div></div>';
  if(BUDGET[q]) h += '<div class="budgetbox"><span class="eyebrow">'+QNAME[q]+' budget</span><b>'+left(q)+' of '+BUDGET[q]+' points left</b></div>';
  h += '</div><div class="board"><h3>Decision log</h3><ul class="log" aria-live="polite">';
  if(!picks.length) h += '<li><span class="empty">No entries yet.</span></li>';
  picks.forEach(function(p){ var c = p.v==='best'?'var(--good)':p.v==='ok'?'var(--amber)':'var(--red)';
    h += '<li><time>'+esc(p.when)+'</time><span><span class="dot" style="background:'+c+'"></span>'+esc(p.short)+'</span></li>'; });
  return h + '</ul></div></aside>';
}
function refreshRail(){ var tmp = document.createElement('div'); tmp.innerHTML = rail(); var r = app.querySelector('.rail'); if(r) r.innerHTML = tmp.querySelector('.rail').innerHTML; }
function progress(){
  var h = '<div class="progress" aria-hidden="true">';
  [1,2,3,4].forEach(function(q){ var now = cur>=0 && S[cur].q===q, done = cur<0 || S[cur].q>q; h += '<span class="'+(done?'done':now?'now':'')+(q===4?' live':'')+'"></span>'; });
  return h + '</div>';
}

function resolveLive(){ var L = LIVE[co.live], sc = L.score(st); liveLvl = sc>=3 ? 0 : sc>=1 ? 1 : 2; meters.exp = clamp(meters.exp + (liveLvl===2?15:liveLvl===1?5:-5)); return liveLvl; }
function scene(){
  var step = S[cur], ch = choicesOf(step), q = step.q, lvl = null;
  if(step.live && liveLvl===null) lvl = resolveLive(); else if(step.live) lvl = liveLvl;
  var h = '<div class="game"><section class="scene"><div class="scene-head"><span class="clock">'+esc(QNAME[q])+'</span><span class="step">'+(BUDGET[q]?left(q)+' budget points left':'No budget this quarter')+'</span></div><div class="scene-body"><h2>'+esc(step.live?LIVE[co.live].label:step.title)+'</h2>'+step.text(st, co);
  if(step.live){ var labs = ['A near miss','Caught late','It got through']; h += '<div class="outcome l'+lvl+'"><span class="verdict">'+labs[lvl]+'</span><p>'+esc(LIVE[co.live].out[lvl])+'</p></div><p class="ask">What do you do now?</p>'; }
  h += '<div class="choices">';
  shuffle(ch.map(function(_,j){ return j; })).forEach(function(j,n){ var c = ch[j], cost = c.cost||0, afford = cost <= left(q) || !BUDGET[q];
    h += '<button class="choice" data-j="'+j+'"'+(afford?'':' disabled aria-disabled="true"')+'><span class="k">'+String.fromCharCode(65+n)+'</span><span>'+esc(c.t)+(BUDGET[q]?' <span class="costtag">'+cost+' pt'+(cost===1?'':'s')+'</span>':'')+(afford?'':' <span class="note">(over budget)</span>')+'</span></button>'; });
  h += '</div><div id="res"></div></div>'+progress()+'</section>'+rail()+'</div>';
  app.innerHTML = h;
  [].forEach.call(app.querySelectorAll('.choice:not([disabled])'), function(b){ b.onclick = function(){ choose(+b.getAttribute('data-j')); }; });
  window.scrollTo(0,0);
}
function apply(j){
  var step = S[cur], c = choicesOf(step)[j], q = step.q;
  if(BUDGET[q] && (c.cost||0) > left(q)) throw new Error('over budget');
  spent[q] = (spent[q]||0) + (c.cost||0);
  for(var k in (c.fx||{})) meters[k] = clamp(meters[k] + c.fx[k]);
  for(var f in (c.set||{})) st[f] = c.set[f];
  picks.push({step:step.id, when:QNAME[q].split(' ·')[0], title:step.live?LIVE[co.live].label:step.title, t:c.t, short:shortOf(c.t), v:c.v, r:c.r, l:c.l, ref:c.ref, j:j});
  return c;
}
function choose(j){
  var c = apply(j);
  [].forEach.call(app.querySelectorAll('.choice'), function(b){ b.disabled = true; if(+b.getAttribute('data-j')===j) b.classList.add('picked'); });
  var lab = c.v==='best'?'Strong call':c.v==='ok'?'Partly right':'Costly call';
  var nx = nextStep(cur+1), res = document.getElementById('res');
  res.innerHTML = '<div class="result '+c.v+'" tabindex="-1"><span class="verdict">'+lab+'</span><p>'+esc(c.r)+'</p><p class="lesson">'+esc(c.l)+' <span class="eyebrow">'+esc(c.ref)+'</span></p><button class="primary" id="next">'+(nx<0?'See the year-end debrief':'Continue')+'</button></div>';
  refreshRail();
  var box = res.firstChild; box.focus({preventScroll:true}); box.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'});
  document.getElementById('next').onclick = function(){ cur = nx; if(cur>=0) scene(); else end(); };
}

/* ---------- run code ---------- */
var CODE = 'CUL1';
function runCode(){ return ReportKit.encode(CODE, [C.indexOf(co)].concat(picks.map(function(p){ return p.j; }))); }
function replay(n){
  if(n[0] >= C.length) return false;
  begin(n[0]);
  try{
    for(var k=1;k<n.length;k++){
      if(cur<0) return false;
      if(S[cur].live && liveLvl===null) resolveLive();
      if(n[k] >= choicesOf(S[cur]).length) return false;
      apply(n[k]); cur = nextStep(cur+1);
    }
  }catch(e){ return false; }
  if(cur>=0) return false;
  end(true); return true;
}

/* ---------- debrief ---------- */
function outcome(){
  var pts = picks.reduce(function(a,p){ return a + (p.v==='best'?2:p.v==='ok'?1:0); }, 0), pct = pts/(picks.length*2);
  var title, sub;
  if(pct>=0.8 && meters.tru>=55){ title = 'A culture people trust'; sub = 'People report what they see, quickly, because nothing bad happens when they do, and you made the secure way the easy way. When something real happened, that\'s what decided how it ended.'; }
  else if(pct>=0.55){ title = 'Better than a completion report'; sub = 'You built some things that change behavior and some that only produce numbers. Look at which choices moved reporting and trust, and which only moved the click rate.'; }
  else { title = 'The numbers looked fine'; sub = 'Whatever the dashboards showed, people didn\'t report, didn\'t trust the security team, or both. That\'s the difference between a check-the-box program and one that works.'; }
  return {title:title, sub:sub, best:picks.filter(function(p){ return p.v==='best'; }).length};
}
function clickReveal(){
  var cr = clickRate();
  return {cr:cr, text: cr===null ? 'You didn\'t run simulated phishing tests, so leadership never saw a click rate.' :
    'Your test used '+LURE[st.lure].name+', and leadership saw a '+cr+'% click rate. Same staff, same year, a different email: about '+LURE.easy.rate+'% with an easy fake password notice, about '+LURE.inv.rate+'% with a realistic invoice, and about '+LURE.bonus.rate+'% with a holiday bonus. You chose the number when you chose the email.'};
}
var EVIDENCE = [
 'UC San Diego Health (published 2025): across nearly 20,000 employees, no measurable link between recent annual training and falling for a phish; the "you clicked" lesson helped by about 2 percentage points; click rates ranged from 1.8% to 30.8% depending on the email.',
 'ETH Zurich researchers (2022): over 15 months and more than 14,000 employees, the "you clicked" lessons didn\'t make people more resilient, and a report button turned staff into an early-warning system.',
 'UK NCSC: four layers of defense against phishing, with people as one of them. "No training package, including phishing simulations, can teach users to spot every phishing attempt."',
 'NIST (2016): security fatigue leads people to give up and make riskier choices. Limit security decisions, make the right action simple, and be consistent.',
 'GoDaddy (December 2020): a simulated phishing test offering a $650 holiday bonus. About 500 employees clicked, were told they had failed, and the company apologized.'
];
function end(rebuilt){
  var o = outcome(), cr = clickReveal(), code = runCode();
  var pn = ReportKit.panel({code:code, rebuilt:rebuilt, getDoc:report});
  var h = '<div class="game"><section class="end"><span class="eyebrow">'+esc(co.name)+' · year-end debrief</span><p class="rk-printname note" style="margin:4px 0 0"></p><h2>'+esc(o.title)+'</h2><p class="lede" style="max-width:62ch">'+esc(o.sub)+'</p>';
  h += '<div class="grid2"><div class="stat"><div class="n">'+meters.rep+'</div><div class="l">reporting (higher is better)</div></div><div class="stat"><div class="n">'+meters.exp+'</div><div class="l">exposure (lower is better)</div></div><div class="stat"><div class="n">'+meters.tru+'</div><div class="l">trust (higher is better)</div></div><div class="stat"><div class="n">'+(cr.cr===null?'n/a':cr.cr+'%')+'</div><div class="l">click rate leadership saw</div></div></div>';
  h += '<div class="outcome '+(cr.cr===null?'l0':st.lure==='easy'?'l1':st.lure==='bonus'?'l2':'l0')+'"><span class="verdict">The click-rate reveal</span><p>'+esc(cr.text)+'</p></div>';
  h += '<div class="sec"><h3>Your decisions</h3><div class="debrief">';
  picks.forEach(function(p){ var lab = p.v==='best'?'Strong call':p.v==='ok'?'Partly right':'Costly call';
    h += '<div class="dl '+p.v+'"><div class="h"><span>'+esc(p.when)+' · '+esc(p.title)+'</span><span>'+lab+' · '+esc(p.ref)+'</span></div><p><b>You chose:</b> '+esc(p.t)+'</p><p class="lesson" style="margin:6px 0 0;font-size:14px;color:var(--muted)">'+esc(p.l)+'</p></div>'; });
  h += '</div></div><div class="real"><h3>The evidence behind the scoring</h3><ul>';
  EVIDENCE.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; });
  h += '</ul><p class="note" style="margin-top:8px">'+esc(co.name)+' and its numbers are invented. The click rates in the reveal are illustrative, chosen within the 1.8% to 30.8% range the UC San Diego study found.</p></div>';
  h += pn.html+'<div class="row"><button class="primary" id="again">Play another company</button><button class="linkbtn" id="same">Replay this one</button></div></section>'+rail()+'</div>';
  app.innerHTML = h; pn.wire();
  var ci = C.indexOf(co);
  document.getElementById('again').onclick = function(){ var k; do{ k = Math.floor(Math.random()*C.length); }while(k===ci && C.length>1); start(k); };
  document.getElementById('same').onclick = function(){ start(ci); };
  window.scrollTo(0,0);
}
function report(name){
  var o = outcome(), cr = clickReveal(), g = function(v){ return v==='best'?'Strong call':v==='ok'?'Partly right':'Costly call'; };
  return {game:'Culture Shift', kind:'Year-end debrief', company:co.name, sector:co.sector, name:name, title:o.title, sub:o.sub, license:ReportKit.LICENSE,
    stats:[{label:'Strong calls', value:o.best, max:picks.length, bar:false},
           {label:M.rep, value:meters.rep, better:'high', note:'higher is better'},{label:M.exp, value:meters.exp, better:'low', note:'lower is better'},{label:M.tru, value:meters.tru, better:'high', note:'higher is better'},
           {label:'Click rate leadership saw', value:(cr.cr===null?'n/a':cr.cr+'%'), bar:false}],
    sections:[{heading:'The click-rate reveal', intro:cr.text},
              {heading:'Your decisions', entries:picks.map(function(p){ return {head:p.when+' · '+p.title, tag:g(p.v)+' · '+p.ref, grade:p.v, chose:p.t, lines:[p.l]}; })},
              {heading:'The evidence behind the scoring', bullets:EVIDENCE, note:co.name+' and its numbers are invented.'}],
    verify:'To check this result, open Culture Shift, choose "Check a result" on the start screen, and paste the run code. The game rebuilds this exact year, and its outcome should match this page.'};
}

homeBtn.onclick = function(){
  var inGame = picks && picks.length && cur>=0;
  if(inGame && !armed){ armed = true; homeBtn.textContent = 'Leave this year?'; setTimeout(function(){ armed = false; homeBtn.textContent = 'New scenario'; }, 4000); return; }
  armed = false; homeBtn.textContent = 'New scenario'; intro();
};
intro();
})();
</script>
